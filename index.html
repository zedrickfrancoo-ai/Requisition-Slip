  const s=newSalt(),h=await hashPw(p,s);await mut(()=>{Object.assign(D.users[i],{pw:{s,h},must:true,fl:0,lu:0})});toast("Temporary password set. They choose a new one at sign-in.");usersV()}
async function addUser(){const v=k=>$("#n_"+k).value.trim(),em=v("em").toLowerCase();if(!v("name")||!em.includes("@")||!v("dept"))return toast("Enter name, email and department.");
  if(!em.endsWith("@"+D.cfg.domain))return toast("Use an email ending in @"+D.cfg.domain);if(!pwOk(v("pw")))return toast(pwMsg);const s=newSalt(),h=await hashPw(v("pw"),s);
  const ok=await mut(()=>{if(D.users.some(u=>u.email==em))return false;D.users.push({email:em,name:v("name"),role:v("role"),roles:[v("role")],dept:v("dept"),active:true,pw:{s,h},must:true});lg("Added user "+em);return true});toast(ok?"Person added.":"That email already has access.");usersV()}
async function saveDom(){const d=$("#dom").value.trim().toLowerCase().replace(/^@/,"");if(!d.includes("."))return toast("Enter a domain like nestle.com");await mut(()=>{D.cfg.domain=d});toast("Saved. Existing emails must use the new domain to sign in.");usersV()}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{const t0=Date.now();try{await loadD();let e=null;try{e=sessionStorage.getItem("st_u")}catch(x){}const u=e&&D.users.find(x=>x.email==e&&x.active);if(u)finish(e);else loginView()}catch(e){$("#app").innerHTML='<div class="card" style="max-width:420px;margin:10vh auto"><h2>Cannot reach the database</h2><p>'+esc(e.message)+'</p><p class="muted">Check the Firebase settings in index.html and that the Firestore rules are published.</p></div>'}setTimeout(hideSplash,Math.max(0,1200-(Date.now()-t0)))})();
