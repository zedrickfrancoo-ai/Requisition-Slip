<style>

*{box-sizing:border-box}
body{margin:0;font:14.5px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#0f4c6b,#1b7f8c 55%,#cfe6ea);background-attachment:fixed;padding-top:env(safe-area-inset-top)}
body.app{background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;height:54px}
header img{width:38px;height:38px}header b{font-size:16px}.sp{flex:1}.who{font-size:12px;opacity:.9;text-align:right;line-height:1.25}
.ib{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}.ib:hover{background:rgba(255,255,255,.24)}
.ib i{position:absolute;top:-5px;right:-5px;background:#d64545;border-radius:999px;font-style:normal;font-size:11px;padding:0 5px;min-width:17px;text-align:center}
nav{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:54px;z-index:4}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}nav button.on{color:var(--navy);border-color:var(--navy)}
main{max-width:960px;margin:0 auto;padding:16px 16px 100px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}label{display:block;font-weight:600;font-size:13px;margin-top:10px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfd5dc;border-radius:8px;font:inherit;background:#fff;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec3d6;border-color:#6aa3bf}
button.b{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
button.b:hover{background:#0b3d57}button.b:disabled{opacity:.4;cursor:not-allowed}button.g{background:var(--ok)}button.r{background:var(--bad)}button.o{background:#fff;color:var(--ink);border:1px solid #cfd5dc}button.o:hover{background:#f3f5f8}

.tbl{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.row>button,.row>.seg{flex:0 0 auto;min-width:0}

.tag.Approved,.tag.Closed{background:#dff3e8;color:var(--ok)}.tag.Rejected,.tag.Cancelled{background:#f8e1dd;color:var(--bad)}.tag.Released{background:#dbeaf3;color:var(--navy)}

.sr{position:relative;margin-bottom:12px}.sr svg{position:absolute;left:12px;top:13px;color:var(--mut)}.sr input{padding:11px 12px 11px 38px;margin:0;font-size:15px}

.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:400;margin:0;cursor:pointer}.chk input{width:auto;margin:0}
.aps{display:flex;gap:6px;flex-wrap:wrap}.ap{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--mut)}.ap.y{color:var(--ok);border-color:#b9dcc9;background:#eef8f2}
.guide{padding-left:20px;line-height:1.9}

.lg-b{padding:40px;background:linear-gradient(160deg,#0f4c6b,#1b7f8c);color:#fff;display:flex;flex-direction:column;min-height:400px}
.lg-b img{width:150px;margin-bottom:auto}.lg-b h2{color:#fff;font-size:28px;line-height:1.15;margin:24px 0 8px}.lg-b p{margin:0;opacity:.9}
.lg-f{padding:40px;background:#fff;display:flex;flex-direction:column;justify-content:center}
@media(max-width:780px){.lg{grid-template-columns:1fr;margin:3vh 12px}.lg-b{min-height:230px;padding:26px}.lg-f{padding:26px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.ov .card{max-width:400px;width:100%}
#msg{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:60;max-width:90vw}
#tour{position:fixed;inset:0;z-index:50;pointer-events:none}
.tspot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,30,45,.65);transition:all .35s ease}
.tspot::after{content:"";position:absolute;inset:-4px;border:2px solid #fff;border-radius:12px;animation:pls 1.3s infinite}
@keyframes pls{0%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
.tip{position:fixed;background:#fff;border-radius:12px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);pointer-events:auto;transition:all .35s ease}
.tip h3{margin:0 0 6px;font-size:16px}.tip p{margin:0 0 12px;color:var(--mut)}.dots{display:flex;gap:4px;margin-bottom:10px}.dots i{width:7px;height:7px;border-radius:4px;background:#d5dae0}.dots i.on{background:var(--navy);width:18px}
.arr{position:fixed;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}
.arr.up{border-bottom:12px solid #fff;animation:bu .8s infinite}.arr.down{border-top:12px solid #fff;animation:bd .8s infinite}
@keyframes bu{50%{transform:translateY(-6px)}}@keyframes bd{50%{transform:translateY(6px)}}
</style></head><body>

<script>

const FB={apiKey:"AIzaSyC241VT08pS7DYQBz1fW10foCvsEByXqL4",authDomain:"rsnpitf.firebaseapp.com",projectId:"rsnpitf",storageBucket:"rsnpitf.firebasestorage.app",messagingSenderId:"145450433572",appId:"1:145450433572:web:486f42ebc6bb864922ecb1"};
if(!FB.apiKey){document.getElementById("app").innerHTML='<div class="card" style="max-width:440px;margin:10vh auto"><h2>Setup needed</h2><p>Paste your Firebase settings into the FB line of index.html (see the guide).</p></div>';throw new Error("Firebase settings missing")}
firebase.initializeApp(FB);const DB=firebase.firestore(),REF=DB.collection("stores").doc("main"),IC=DB.collection("stores_items");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});

let D,U=null,ITEMS=[],IDX={},view="catalog",cart=[],q="",found=[];
try{cart=JSON.parse(localStorage.getItem("cart")||"[]").filter(c=>c.m!="_demo")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const CODES=[{"s":"Engineering - M&I and E&A","k":"cc","c":"643819001","l":""},{"s":"Engineering - M&I and E&A","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"Engineering - M&I and E&A","k":"gl","c":"5034020","l":"PPE"},{"s":"Engineering - IS","k":"cc","c":"643817501","l":"Water"},{"s":"Engineering - IS","k":"cc","c":"643817601","l":"Waste Water Treatment"},{"s":"Engineering - IS","k":"cc","c":"643817101","l":"Steam"},{"s":"Engineering - IS","k":"cc","c":"643817201","l":"Refrigeration"},{"s":"Engineering - IS","k":"cc","c":"643817701","l":"Compressed Air"},{"s":"Engineering - IS","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"Engineering - IS","k":"gl","c":"5034020","l":"PPE"},{"s":"Engineering - Project","k":"cc","c":"643846001","l":""},{"s":"Engineering - Project","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"Engineering - Project","k":"gl","c":"5034020","l":"PPE"},{"s":"Production - Tower 1","k":"cc","c":"643850199","l":"T1 - Process Common"},{"s":"Production - Tower 1","k":"cc","c":"643851199","l":"T1 - F/P Common"},{"s":"Production - Tower 1","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"Production - Tower 1","k":"gl","c":"5034020","l":"PPE"},{"s":"Production - RTD","k":"cc","c":"643871199","l":"RTD - Process Common"},{"s":"Production - RTD","k":"cc","c":"643871099","l":"RTD - F/P Common"},{"s":"Production - RTD","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"QA","k":"cc","c":"643821199","l":""},{"s":"QA","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"QA","k":"gl","c":"5034020","l":"PPE"},{"s":"QA","k":"gl","c":"5046010","l":"Laboratory Materials"},{"s":"FSC","k":"cc","c":"643816401","l":""},{"s":"FSC","k":"gl","c":"5046000","l":"Operating Supplies"},{"s":"FSC","k":"gl","c":"5034020","l":"PPE"},{"s":"SHE","k":"cc","c":"643830111","l":""},{"s":"SHE","k":"gl","c":"6028000","l":""}];
const seed=()=>({cfg:{domain:"demo.local",seq:0},codes:CODES,reqs:[],users:["admin","approver","storekeeper","requester"].map(r=>({email:r+"@demo.local",name:"Demo "+r[0].toUpperCase()+r.slice(1),role:r,dept:"Stores",active:true}))});
async function loadD(){const s=await REF.get();if(s.exists)D=s.data();else{D=seed();await REF.set(D)}}
async function mut(fn){await loadD();const r=await fn();await REF.set(D);return r}

/* ---------- passwords ---------- */
const en=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""),newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(12)));
async function hashPw(p,s){const k=await crypto.subtle.importKey("raw",en.encode(p),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:en.encode(s),iterations:100000},k,256))}
const pwOk=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p),pwMsg="Password needs at least 8 characters, with letters and numbers.";

/* ---------- login (same flow as E-Gate Pass) ---------- */
function loginView(){
  $("#app").innerHTML=`<div class="lg"><div class="lg-b"><img src="logo.png" alt=""><h2>Every requisition, approved and on record.</h2><p>Request, approve, release and track store items in one place.</p></div>
  <div class="lg-f"><h2>Sign in</h2><label>Company email<input id="em" type="email" autocomplete="username" placeholder="name@${esc(D?D.cfg.domain:"company.com")}"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="row" style="margin-top:12px"><button class="b" onclick="doLogin()">Sign in</button></div>
  <p class="muted" style="margin-top:8px;font-size:11px">Version 3 · Firebase</p><p class="muted" style="margin-top:20px">Use your company email and your personal password. First time? Sign in with your email and you will be asked to create a password.</p></div></div>`;
  $("#pw").addEventListener("keydown",e=>{if(e.key=="Enter")doLogin()});
}
async function doLogin(){try{await _doLogin()}catch(e){toast('Error: '+(e.message||e));console.error(e)}}
async function _doLogin(){
  await loadD();const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,d=D.users.find(x=>x.email==em);
  if(!em.endsWith("@"+D.cfg.domain))return toast("Use your company email (@"+D.cfg.domain+")");
  if(!d||!d.active)return toast("Incorrect email or password.");
  if(d.lu&&d.lu>Date.now())return toast("Too many wrong attempts. Try again in "+Math.ceil((d.lu-Date.now())/6e4)+" min.");
  if(!d.pw)return pwModal(em,"Create your password","This account has no password yet. "+pwMsg);
  if(await hashPw(pw,d.pw.s)!=d.pw.h){await mut(()=>{const u=D.users.find(x=>x.email==em);u.fl=(u.fl||0)+1;if(u.fl>=5){u.lu=Date.now()+3e5;u.fl=0}});return toast("Incorrect email or password.")}
  if(d.must)return pwModal(em,"Choose a new password","You signed in with a temporary password. "+pwMsg);
  finish(em);
}
function pwModal(em,t,n){$("#modal").innerHTML=`<div class="ov"><div class="card"><h2>${t}</h2><p class="muted">${n}</p><label>New password<input id="p1" type="password" autocomplete="new-password"></label><label>Confirm password<input id="p2" type="password" autocomplete="new-password"></label>
  <div class="row" style="margin-top:12px"><button class="b" onclick="savePw('${esc(em)}')">Save and sign in</button><button class="b o" onclick="$('#modal').innerHTML=''">Cancel</button></div></div></div>`}
async function savePw(em){const a=$("#p1").value;if(!pwOk(a))return toast(pwMsg);if(a!=$("#p2").value)return toast("The two passwords do not match.");
  const s=newSalt(),h=await hashPw(a,s);await mut(()=>{const u=D.users.find(x=>x.email==em);u.pw={s,h};u.must=false;u.fl=0});$("#modal").innerHTML="";finish(em);toast("Password saved.")}
function finish(em){U=D.users.find(x=>x.email==em);try{sessionStorage.setItem("st_u",em)}catch(e){}view=U.role=="requester"?"shop":"req";document.body.classList.add("app");shell().then(()=>{let s=0;try{s=localStorage.getItem("tour_"+em)}catch(e){}if(!s)setTimeout(startTour,500)})}
function logout(){U=null;const t=$("#tour");if(t)t.remove();document.body.classList.remove("app");try{sessionStorage.removeItem("st_u")}catch(e){}loginView()}

/* ---------- icons ---------- */
const IP={search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.1a2 2 0 002-1.5L21 8H6"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',check:'<path d="M20 6L9 17l-5-5"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IP[n]}</svg>`;

/* ---------- shell: each role sees only its own screens ---------- */
const TABS={requester:[["shop","Shop","box"],["req","My requests","list"],["help","Help","help"]],approver:[["req","Approvals","check"],["help","Help","help"]],storekeeper:[["req","Release","box"],["stock","Stock","list"],["help","Help","help"]],admin:[["req","Requests","list"],["log","Activity log","clock"],["stock","Stock","box"],["users","Users","user"],["help","Help","help"]]};
const canPrice=()=>["approver","storekeeper","admin"].includes(U.role);
const VIEWS={shop:()=>shopV(),cart:()=>cartV(),req:()=>reqV(),stock:()=>stockV(),users:()=>usersV(),log:()=>logV(),help:()=>helpV()};
const lg=t=>{D.log=[{t:new Date().toISOString(),w:U.name,a:t},...(D.log||[])].slice(0,500)};
async function shell(){
  $("#app").innerHTML=`<header><img src="logo.png" alt=""><b>Stores Requisition</b><span class="sp"></span><div class="who">${esc(U.name)}<br>${U.role}</div>${U.role=="requester"?`<button class="ib" id="cartb" title="Cart" onclick="go('cart')">${ic("cart",20)}<i id="cbn">${cartQty()}</i></button>`:""}<button class="ib" title="Guided tour" onclick="startTour()">${ic("help",20)}</button><button class="ib" title="Sign out" onclick="logout()">${ic("out",20)}</button></header>
  <nav>${TABS[U.role].map(([k,l,i])=>`<button id="tab-${k}" class="${k==view?"on":""}" onclick="go('${k}')">${ic(i,16)}${l}</button>`).join("")}</nav><main id="main">Loading…</main>`;
  await loadD();U=D.users.find(x=>x.email==U.email)||U;await VIEWS[view]()}
const go=v=>{view=v;return shell()};
async function loadItems(force){if(ITEMS.length&&!force)return;const s=await IC.get();ITEMS=[];IDX={};
  s.docs.forEach(d=>JSON.parse(d.data().j).forEach(r=>{IDX[r[0]]=+d.id.slice(1);ITEMS.push({m:r[0],d:r[1],u:r[2],s:r[3],p:r[4]})}))}

/* ---------- shop (requester only, no prices) ---------- */
let lim=30;
const inCart=m=>cart.find(c=>c.m==m),cartQty=()=>cart.reduce((s,c)=>s+c.q,0);
const stl=i=>i.s<=0?'<span class="st-out">Out of stock</span>':i.s<=5?`<span class="st-low">Only ${i.s} left</span>`:`${i.s} ${esc(i.u)} available`;
const bar=()=>cart.length?`<div id="bar" class="bar"><span>${ic("cart")} <b>${cartQty()}</b> item(s) in cart</span><button class="b" onclick="go('cart')">View cart</button></div>`:'<div id="bar"></div>';
function setBar(){const b=$("#bar");if(b)b.outerHTML=bar();const n=$("#cbn");if(n)n.textContent=cartQty()}
async function shopV(){await loadItems();$("#main").innerHTML=`<div class="sr">${ic("search")}<input id="q" placeholder="Search item or material number" value="${esc(q)}" oninput="lim=30;draw()"></div><div id="list"></div><div id="more" style="text-align:center;margin-top:10px"></div>${bar()}`;draw()}
function draw(){q=$("#q").value.trim();const t=q.toLowerCase(),l=ITEMS.filter(i=>!t||(i.d+" "+i.m).toLowerCase().includes(t));found=l.slice(0,lim);
  $("#list").innerHTML=found.map((i,n)=>{const c=inCart(i.m);return`<div class="it"><div class="ic">${ic("box",20)}</div><div class="nm"><b>${esc(i.d)}</b><span class="meta">${esc(i.m)} · ${stl(i)}</span></div>${c?`<div class="stp"><button onclick="qty(${n},-1)">${ic("minus",14)}</button><b>${c.q}</b><button onclick="qty(${n},1)">${ic("plus",14)}</button></div>`:`<button class="b add" ${i.s>0?"":"disabled"} onclick="qty(${n},1)">${ic("plus",14)} Add</button>`}</div>`}).join("")||'<div class="card meta">No items found.</div>';
  $("#more").innerHTML=l.length>lim?`<button class="b o" onclick="lim+=30;draw()">Show more (${l.length-lim})</button>`:"";setBar()}
function qty(n,d){const i=found[n];let c=inCart(i.m);if(!c){if(i.s<=0)return;c={m:i.m,d:i.d,u:i.u,p:i.p,s:i.s,q:0};cart.push(c)}
  c.q+=d;if(c.q>i.s){c.q=i.s;toast("Only "+i.s+" in stock")}if(c.q<1)cart=cart.filter(x=>x!=c);saveCart();draw()}

/* ---------- cart + choose approvers ---------- */

function cq(n,d){const c=cart[n];c.q+=d;if(c.q>c.s){c.q=c.s;toast("Only "+c.s+" in stock")}if(c.q<1)cart.splice(n,1);saveCart();if(!cart.length)return cartV();$("#cl").innerHTML=crows();$("#cn").textContent=cartQty();setBar()}
async function cartV(){

function fillCodes(){const s=$("#sec").value,f=k=>D.codes.filter(c=>c.s==s&&c.k==k).map(c=>`<option value="${esc(c.c)}">${esc(c.c)} ${esc(c.l)}</option>`).join("");$("#cc").innerHTML="<option value=''>Cost center…</option>"+f("cc");$("#gl").innerHTML="<option value=''>GL account…</option>"+f("gl")}
async function checkout(){const section=$("#sec").value,cc=$("#cc").value,gl=$("#gl").value,apprs=[...document.querySelectorAll(".apc:checked")].map(x=>x.value);

let rf="todo";
const nm=e=>(D.users.find(u=>u.email==e)||{name:e}).name;
const needs=r=>({requester:!["Closed","Rejected","Cancelled"].includes(r.status),approver:r.status=="Submitted"&&(r.apprs||[]).includes(U.email)&&!(r.ok||[]).includes(U.email),storekeeper:r.status=="Approved",admin:["Submitted","Approved"].includes(r.status)})[U.role];
const mine=r=>U.role=="requester"?r.by==U.email:U.role=="approver"?(r.apprs||[]).includes(U.email):true;
function reqV(){const all=D.reqs.filter(mine),list=all.filter(r=>rf=="all"||needs(r)),T={requester:"My requests",approver:"Approvals",storekeeper:"Release queue",admin:"All requests"}[U.role];
  $("#main").innerHTML=`<div class="row" style="margin-bottom:12px"><h2 style="flex:1;margin:0">${T}</h2><div class="seg">${[["todo",U.role=="requester"?"Active":"Needs action"],["all","All"]].map(([k,l])=>`<button class="${rf==k?"on":""}" onclick="rf='${k}';reqV()">${l}${k=="todo"?` (${all.filter(needs).length})`:""}</button>`).join("")}</div><button class="b o" onclick="exportCsv()">${ic("dl",16)} CSV</button></div>${list.map(rcard).join("")||'<div class="card meta">Nothing here.</div>'}`}
function rcard(r){const pr=canPrice(),tot=r.lines.reduce((s,l)=>s+l.q*(l.p||0),0),ap=r.apprs||[],ok=r.ok||[],own=r.by==U.email,sub=r.status=="Submitted",a=[],ro=U.role;
  if(sub&&(ro=="admin"||(ro=="approver"&&ap.includes(U.email)&&!ok.includes(U.email))))a.push(`<button class="b g" onclick="act('${r.id}','ok')">${ic("check",16)} Approve</button><button class="b r" onclick="act('${r.id}','no')">${ic("x",16)} Reject</button>`);
  if(r.status=="Approved"&&["storekeeper","admin"].includes(ro))a.push(`<button class="b" onclick="release('${r.id}')">${ic("box",16)} Release</button>`);
  if(r.status=="Released"&&own)a.push(`<button class="b g" onclick="act('${r.id}','done')">${ic("check",16)} Confirm received</button>`);
  if(sub&&own)a.push(`<button class="b o" onclick="act('${r.id}','cancel')">Cancel request</button>`);
  return`<div class="card"><div class="row" style="margin-bottom:6px"><b style="flex:0 0 auto">${r.id}</b><span class="tag ${r.status}" style="flex:0 0 auto">${r.status}</span><span class="meta" style="flex:1;text-align:right">${new Date(r.at).toLocaleString()}</span></div>
  <div class="meta">${esc(r.name)} · ${esc(r.dept)} · ${esc(r.section)} · CC ${esc(r.cc)} · GL ${esc(r.gl)}</div>
  <table style="margin:8px 0">${r.lines.map(l=>`<tr><td>${esc(l.d)}<div class="meta">${esc(l.m)}</div></td><td style="width:90px">${l.q} ${esc(l.u)}</td>${pr?`<td style="width:110px;text-align:right">₱${money(l.q*l.p)}</td>`:""}</tr>`).join("")}${pr?`<tr><td colspan="2" style="text-align:right"><b>Total</b></td><td style="text-align:right"><b>₱${money(tot)}</b></td></tr>`:""}</table>
  ${r.remarks?`<div class="meta" style="margin-bottom:6px">Remarks: ${esc(r.remarks)}</div>`:""}${ap.length?`<div class="aps">${ap.map(e=>`<span class="ap ${ok.includes(e)?"y":""}">${ic(ok.includes(e)?"check":"clock",13)} ${esc(nm(e))}</span>`).join("")}</div>`:""}${a.length?`<div class="row acts" style="margin-top:10px">${a.join("")}</div>`:""}</div>`}
async function act(id,a){await mut(()=>{const r=D.reqs.find(x=>x.id==id);r.ok=r.ok||[];const ap=r.apprs||[],isA=U.role=="admin"||(U.role=="approver"&&ap.includes(U.email)),sub=r.status=="Submitted";
  if(a=="ok"&&sub&&isA){if(U.role=="admin")r.ok=[...ap];else if(!r.ok.includes(U.email))r.ok.push(U.email);if(ap.every(e=>r.ok.includes(e)))r.status="Approved";lg("Approved "+id+(U.role=="admin"?" (admin)":""))}
  else if(a=="no"&&sub&&isA){r.status="Rejected";lg("Rejected "+id)}
  else if(a=="done"&&r.status=="Released"&&r.by==U.email){r.status="Closed";lg("Confirmed received "+id)}
  else if(a=="cancel"&&sub&&r.by==U.email){r.status="Cancelled";lg("Cancelled "+id)}
  else return toast("Not allowed.")});reqV()}
async function release(id){
  try{await loadD();const r=D.reqs.find(x=>x.id==id);if(r.status!="Approved")throw Error("Request is not approved");await loadItems(true);
    const by={};r.lines.forEach(l=>{if(IDX[l.m]==null)throw Error("Item not in stock list: "+l.m);(by[IDX[l.m]]=by[IDX[l.m]]||[]).push(l)});
    await DB.runTransaction(async t=>{const ks=Object.keys(by),ds=await Promise.all(ks.map(k=>t.get(IC.doc("c"+k))));
      const out=ds.map((d,i)=>{const a=JSON.parse(d.data().j);by[ks[i]].forEach(l=>{const row=a.find(x=>x[0]==l.m);if(!row||row[3]<l.q)throw Error("Not enough stock: "+l.m);row[3]-=l.q});return[ks[i],a]});
      out.forEach(([k,a])=>t.update(IC.doc("c"+k),{j:JSON.stringify(a)}))});
    await mut(()=>{D.reqs.find(y=>y.id==id).status="Released";lg("Released "+id)});ITEMS=[];toast("Released. Stock updated.")}
  catch(e){toast(e.message)}reqV()}
function exportCsv(){const pr=canPrice(),safe=v=>{v=String(v??"");return'"'+(/^[=+\-@]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"'};
  const rows=[["RS","Date","Requester","Section","CC","GL","Status","Material","Description","UoM","Qty"].concat(pr?["Unit price","Amount"]:[])];
  D.reqs.filter(mine).forEach(r=>r.lines.forEach(l=>rows.push([r.id,r.at.slice(0,10),r.name,r.section,r.cc,r.gl,r.status,l.m,l.d,l.u,l.q].concat(pr?[l.p,l.q*l.p]:[]))));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(safe).join(",")).join("\n")],{type:"text/csv"}));a.download="requisitions.csv";a.click()}

let tI=0,tS=[];

function tPlace(el,t,x){const sp=$(".tspot"),tip=$(".tip"),ar=$(".arr"),n=tS.length,W=innerWidth,H=innerHeight,tw=Math.min(320,W-24);if(!tip)return;

async function stockV(){await loadItems();$("#main").innerHTML=`<div class="card"><h2>Stock (${ITEMS.length} items)</h2><div class="row"><input id="sq" placeholder="Search stock…" onkeydown="if(event.key=='Enter')stockList()"><button class="b" onclick="stockList()">Search</button></div>
  <p class="muted">Import a CSV with columns: material_no, description, uom, stock, unit_price. This replaces the current stock list.</p><input type="file" id="f" accept=".csv" onchange="importCsv(this.files[0])"><div id="sl" class="tbl"></div></div>`;stockList()}
function stockList(){const t=($("#sq").value||"").toLowerCase(),l=ITEMS.filter(i=>!t||(i.d+" "+i.m).toLowerCase().includes(t)).slice(0,100);
  $("#sl").innerHTML=`<table><tr><th>Material</th><th>Description</th><th>Stock</th><th>Price</th></tr>${l.map(i=>`<tr><td>${esc(i.m)}</td><td>${esc(i.d)}</td><td>${i.s} ${esc(i.u)}</td><td>${money(i.p)}</td></tr>`).join("")}</table>`}
function parseCsv(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
async function importCsv(file){if(!file)return;const rows=parseCsv(await file.text()),h=rows.shift().map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k);if(ix("material_no")<0)return toast("Column material_no not found");
  const seen={},all=[];rows.forEach(r=>{const m=(r[ix("material_no")]||"").trim();if(m&&!seen[m]){seen[m]=1;all.push([m,r[ix("description")]||"",r[ix("uom")]||"",+r[ix("stock")]||0,+r[ix("unit_price")]||0])}});
  try{const old=await IC.get(),n=Math.ceil(all.length/400);for(let c=0;c<n;c++){await IC.doc("c"+c).set({j:JSON.stringify(all.slice(c*400,c*400+400))});toast("Importing "+Math.min((c+1)*400,all.length)+" / "+all.length)}
    await Promise.all(old.docs.filter(d=>+d.id.slice(1)>=n).map(d=>d.ref.delete()));ITEMS=[];toast("Imported "+all.length+" items");stockV()}catch(e){toast(e.message)}}

async function tempPw(i){const p=prompt("Temporary password for "+D.users[i].name+" (8+ characters, letters and numbers):");if(!p)return;if(!pwOk(p))return toast(pwMsg);
  const s=newSalt(),h=await hashPw(p,s);await mut(()=>{Object.assign(D.users[i],{pw:{s,h},must:true,fl:0,lu:0})});toast("Temporary password set. They choose a new one at sign-in.");usersV()}
async function addUser(){const v=k=>$("#n_"+k).value.trim(),em=v("em").toLowerCase();if(!v("name")||!em.includes("@")||!v("dept"))return toast("Enter name, email and department.");
  if(!em.endsWith("@"+D.cfg.domain))return toast("Use an email ending in @"+D.cfg.domain);if(!pwOk(v("pw")))return toast(pwMsg);const s=newSalt(),h=await hashPw(v("pw"),s);
