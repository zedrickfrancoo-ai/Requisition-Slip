<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stores Requisition</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f4c6b">
<style>
:root{--brown:#6b5444;--brown2:#85705f;--navy:#0f4c6b;--teal:#1b7f8c;--glass:rgba(255,255,255,.78);--line:rgba(107,84,68,.18);--ok:#2e7d5b;--bad:#b3402f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;color:#2b2420;min-height:100vh;background:linear-gradient(160deg,#0f4c6b,#1b7f8c 55%,#cfe6ea);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(15,76,107,.85);backdrop-filter:blur(10px);color:#fff;position:sticky;top:0;z-index:5}
header img{width:40px;height:40px;border-radius:10px}header b{font-size:17px}header span{margin-left:auto;font-size:13px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{border:0;border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.25);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:#fff;color:var(--brown)}
main{max-width:1000px;margin:0 auto;padding:6px 16px 40px}
.card{background:var(--glass);backdrop-filter:blur(8px);border:1px solid #fff8;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
h2{margin:0 0 10px;color:var(--brown)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin:4px 0}
button.b{border:0;border-radius:10px;padding:9px 16px;background:var(--brown);color:#fff;font-weight:600;cursor:pointer}
button.b:hover{background:var(--brown2)}button.g{background:var(--ok)}button.r{background:var(--bad)}button.o{background:#fff;color:var(--brown);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--brown);font-size:13px}
.tbl{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.row>button{flex:0 0 auto}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#e9e2dc;color:var(--brown);font-size:12px;font-weight:700}
.tag.Approved,.tag.Closed{background:#d8efe4;color:var(--ok)}.tag.Rejected,.tag.Cancelled{background:#f6dcd7;color:var(--bad)}.tag.Released{background:#d5e9f0;color:var(--navy)}
.login{max-width:380px;margin:8vh auto}.login img{width:110px;border-radius:24px;display:block;margin:0 auto 10px}.muted{color:#6d625b;font-size:13px}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
</style></head><body>
<div id="app"></div><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://ivhbamfcggonijziakwd.supabase.co", SB_KEY="sb_publishable_48T7fUhU3km5unBoTmZ_Gg_Fb86RpMy";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
let me=null,view="catalog",cart=[],codes=[],q="";
try{cart=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",3200)}
const fail=e=>{if(e){toast(e.message||String(e));return true}};
const TABS={catalog:"Catalog",requests:"Requests",stock:"Stock",users:"Users"};
const canTab=t=>t=="stock"?["storekeeper","admin"].includes(me.role):t=="users"?me.role=="admin":true;

async function boot(){
  if(SB_URL.startsWith("YOUR_"))return $("#app").innerHTML='<div class="card login"><h2>Setup needed</h2>Add your Supabase URL and key in index.html (see README).</div>';
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  me=data;
  if(!me||!me.active)return loginView("Your account is waiting for admin approval.");
  codes=(await sb.from("codes").select("*")).data||[];
  shell();
}
function loginView(note=""){
  $("#app").innerHTML=`<div class="card login"><img src="icons/icon-192.png" alt=""><h2 style="text-align:center">Stores Requisition</h2>
  ${note?`<p class="muted" style="text-align:center">${esc(note)}</p>`:""}
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
  <div id="su" style="display:none"><input id="nm" placeholder="Full name"><input id="dp" placeholder="Department"></div>
  <div class="row" style="margin-top:8px"><button class="b" id="go" onclick="auth()">Sign in</button><button class="b o" onclick="toggleSu()">Create account</button></div></div>`;
}
let signup=false;
function toggleSu(){signup=!signup;$("#su").style.display=signup?"block":"none";$("#go").textContent=signup?"Request account":"Sign in"}
async function auth(){
  const email=$("#em").value.trim(),password=$("#pw").value;
  if(signup){const {error}=await sb.auth.signUp({email,password,options:{data:{name:$("#nm").value,dept:$("#dp").value}}});
    if(fail(error))return;await sb.auth.signOut();return loginView("Request sent. An admin will approve your account.")}
  const {error}=await sb.auth.signInWithPassword({email,password});if(fail(error))return;boot();
}
async function logout(){await sb.auth.signOut();me=null;loginView()}

function shell(){
  $("#app").innerHTML=`<header><img src="icons/icon-192.png" alt=""><b>Stores Requisition</b><span>${esc(me.name||me.email)} · ${me.role}</span><button class="b o" onclick="logout()">Sign out</button></header>
  <nav>${Object.keys(TABS).filter(canTab).map(t=>`<button class="${t==view?"on":""}" onclick="go('${t}')">${TABS[t]}${t=="catalog"&&cart.length?" ("+cart.length+")":""}</button>`).join("")}</nav><main id="main"></main>`;
  ({catalog:catalogV,requests:requestsV,stock:stockV,users:usersV})[view]();
}
const go=v=>{view=v;shell()};

/* ---------- Catalog + cart ---------- */
async function catalogV(){
  const sections=[...new Set(codes.map(c=>c.section))];
  $("#main").innerHTML=`<div class="card"><h2>Find items</h2><div class="row"><input id="q" placeholder="Search by description or material no." value="${esc(q)}" onkeydown="if(event.key=='Enter')search()"><button class="b" onclick="search()">Search</button></div><div id="res" class="tbl"></div></div>
  <div class="card"><h2>My cart</h2><div id="cart" class="tbl"></div>
  <div id="co" style="${cart.length?"":"display:none"}"><div class="row"><select id="sec" onchange="fillCodes()"><option value="">Section…</option>${sections.map(s=>`<option>${esc(s)}</option>`).join("")}</select><select id="cc"></select><select id="gl"></select></div>
  <textarea id="rem" placeholder="Remarks / purpose" rows="2"></textarea><button class="b g" onclick="checkout()">Submit requisition</button></div></div>`;
  showCart();search();
}
function fillCodes(){const s=$("#sec").value,f=k=>codes.filter(c=>c.section==s&&c.kind==k).map(c=>`<option value="${esc(c.code)}">${esc(c.code)} ${esc(c.label)}</option>`).join("");
  $("#cc").innerHTML="<option value=''>Cost center…</option>"+f("cc");$("#gl").innerHTML="<option value=''>GL account…</option>"+f("gl")}
async function search(){
  q=$("#q").value.trim();let r=sb.from("items").select("*").order("description").limit(40);
  if(q){const t=q.replace(/[%,()]/g,"");r=r.or(`description.ilike.%${t}%,material_no.ilike.%${t}%`)}
  const {data,error}=await r;if(fail(error))return;window.found=data;
  $("#res").innerHTML=`<table><tr><th>Material</th><th>Description</th><th>Stock</th><th></th></tr>${data.map((i,n)=>`<tr><td>${esc(i.material_no)}</td><td>${esc(i.description)}</td><td>${i.stock} ${esc(i.uom)}</td><td><button class="b" ${i.stock>0?"":"disabled"} onclick="add(${n})">Add</button></td></tr>`).join("")||"<tr><td>No items</td></tr>"}</table>`;
}
function add(n){const i=found[n],c=cart.find(x=>x.material_no==i.material_no);c?c.qty++:cart.push({...i,qty:1});saveCart();showCart();toast("Added")}
function showCart(){
  $("#cart").innerHTML=cart.length?`<table><tr><th>Item</th><th>Qty</th><th></th></tr>${cart.map((c,n)=>`<tr><td>${esc(c.description)}<div class="muted">${esc(c.material_no)}</div></td><td><input type="number" min="1" max="${c.stock}" value="${c.qty}" style="width:80px" onchange="cart[${n}].qty=Math.max(1,+this.value||1);saveCart()"> ${esc(c.uom)}</td><td><button class="b r" onclick="cart.splice(${n},1);saveCart();showCart();$('#co').style.display=cart.length?'':'none'">✕</button></td></tr>`).join("")}</table>`:"<span class='muted'>Cart is empty.</span>";
}
async function checkout(){
  const section=$("#sec").value,cc=$("#cc").value,gl=$("#gl").value;
  if(!section||!cc||!gl)return toast("Choose section, cost center and GL account");
  const {data:r,error}=await sb.from("reqs").insert({user_id:me.id,section,cc,gl,remarks:$("#rem").value}).select().single();if(fail(error))return;
  const {error:e2}=await sb.from("lines").insert(cart.map(c=>({rs:r.rs,material_no:c.material_no,description:c.description,uom:c.uom,qty:c.qty,unit_price:c.unit_price})));if(fail(e2))return;
  cart=[];saveCart();toast("Requisition RS-"+r.rs+" submitted");go("requests");
}

/* ---------- Requests ---------- */
let reqData=[];
async function requestsV(){
  const {data,error}=await sb.from("reqs").select("*,lines(*),profiles(name)").order("rs",{ascending:false}).limit(200);if(fail(error))return;reqData=data;
  const priced=["storekeeper","admin"].includes(me.role)||true;
  $("#main").innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Requisitions</h2><button class="b o" onclick="exportCsv()">Download CSV</button></div><div class="tbl"><table><tr><th>RS</th><th>By</th><th>Section / CC / GL</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr>
  ${data.map(r=>{const t=r.lines.reduce((s,l)=>s+l.qty*l.unit_price,0),own=r.user_id==me.id,ro=me.role;
   const a=[];
   if(r.status=="Submitted"&&["approver","admin"].includes(ro)&&!(own&&ro!="admin"))a.push(`<button class="b g" onclick="act(${r.rs},'Approved')">Approve</button><button class="b r" onclick="act(${r.rs},'Rejected')">Reject</button>`);
   if(r.status=="Approved"&&["storekeeper","admin"].includes(ro))a.push(`<button class="b" onclick="release(${r.rs})">Release</button>`);
   if(r.status=="Released"&&own)a.push(`<button class="b g" onclick="act(${r.rs},'Closed')">Confirm received</button>`);
   if(r.status=="Submitted"&&own)a.push(`<button class="b o" onclick="act(${r.rs},'Cancelled')">Cancel</button>`);
   return`<tr><td>RS-${r.rs}<div class="muted">${new Date(r.created).toLocaleDateString()}</div></td><td>${esc(r.profiles?.name)}</td><td>${esc(r.section)}<div class="muted">${esc(r.cc)} · ${esc(r.gl)}</div></td>
   <td>${r.lines.map(l=>`${l.qty} ${esc(l.uom)} ${esc(l.description)}`).map(x=>`<div>${x}</div>`).join("")}</td><td>${money(t)}</td><td><span class="tag ${r.status}">${r.status}</span></td><td>${a.join(" ")}</td></tr>`}).join("")||"<tr><td>No requisitions yet.</td></tr>"}</table></div></div>`;
}
async function act(rs,status){
  const f={status,actor:me.name||me.email};if(status=="Approved"||status=="Rejected")f.decided=new Date().toISOString();if(status=="Closed")f.closed=new Date().toISOString();
  const {error}=await sb.from("reqs").update(f).eq("rs",rs);if(fail(error))return;toast("RS-"+rs+" "+status.toLowerCase());requestsV();
}
async function release(rs){const {error}=await sb.rpc("release_req",{p_rs:rs});if(fail(error))return;toast("Released, stock updated");requestsV()}
function exportCsv(){
  const safe=v=>{v=String(v??"");return '"'+(/^[=+\-@]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"'};
  const rows=[["RS","Date","Requester","Section","CC","GL","Status","Material","Description","UoM","Qty","Unit price"]];
  reqData.forEach(r=>r.lines.forEach(l=>rows.push([r.rs,r.created.slice(0,10),r.profiles?.name,r.section,r.cc,r.gl,r.status,l.material_no,l.description,l.uom,l.qty,l.unit_price])));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(safe).join(",")).join("\n")],{type:"text/csv"}));a.download="requisitions.csv";a.click();
}

/* ---------- Stock ---------- */
async function stockV(){
  $("#main").innerHTML=`<div class="card"><h2>Stock</h2><div class="row"><input id="sq" placeholder="Search stock…" onkeydown="if(event.key=='Enter')stockList()"><button class="b" onclick="stockList()">Search</button></div>
  <p class="muted">Import a CSV with columns: material_no, description, uom, stock, unit_price. Existing items are updated.</p><input type="file" id="f" accept=".csv" onchange="importCsv(this.files[0])"><div id="sl" class="tbl"></div></div>`;stockList();
}
async function stockList(){
  const t=($("#sq").value||"").replace(/[%,()]/g,"");let r=sb.from("items").select("*").order("description").limit(100);if(t)r=r.or(`description.ilike.%${t}%,material_no.ilike.%${t}%`);
  const {data,error}=await r;if(fail(error))return;
  $("#sl").innerHTML=`<table><tr><th>Material</th><th>Description</th><th>Stock</th><th>Price</th></tr>${data.map(i=>`<tr><td>${esc(i.material_no)}</td><td>${esc(i.description)}</td><td>${i.stock} ${esc(i.uom)}</td><td>${money(i.unit_price)}</td></tr>`).join("")}</table>`;
}
function parseCsv(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
async function importCsv(file){
  if(!file)return;const rows=parseCsv(await file.text()),h=rows.shift().map(x=>x.trim().toLowerCase());
  const ix=k=>h.indexOf(k);if(ix("material_no")<0)return toast("Column material_no not found");
  const items=rows.filter(r=>r[ix("material_no")]).map(r=>({material_no:r[ix("material_no")].trim(),description:r[ix("description")]||"",uom:r[ix("uom")]||"",stock:+r[ix("stock")]||0,unit_price:+r[ix("unit_price")]||0}));
  for(let i=0;i<items.length;i+=500){const {error}=await sb.from("items").upsert(items.slice(i,i+500));if(fail(error))return;toast(`Imported ${Math.min(i+500,items.length)} / ${items.length}`)}
  stockList();
}

/* ---------- Users ---------- */
async function usersV(){
  const {data,error}=await sb.from("profiles").select("*").order("active").order("name");if(fail(error))return;
  $("#main").innerHTML=`<div class="card"><h2>Users</h2><div class="tbl"><table><tr><th>Name</th><th>Email / Dept</th><th>Role</th><th>Access</th></tr>${data.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}<div class="muted">${esc(u.dept)}</div></td>
  <td><select onchange="setUser('${u.id}',{role:this.value})">${["requester","approver","storekeeper","admin"].map(r=>`<option ${r==u.role?"selected":""}>${r}</option>`).join("")}</select></td>
  <td><button class="b ${u.active?"r":"g"}" onclick="setUser('${u.id}',{active:${!u.active}},true)">${u.active?"Disable":"Approve"}</button></td></tr>`).join("")}</table></div></div>`;
}
async function setUser(id,f,re){const {error}=await sb.from("profiles").update(f).eq("id",id);if(fail(error))return;toast("Saved");if(re)usersV()}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script></body></html>
